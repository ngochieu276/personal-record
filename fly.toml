# Fly.io app config for the Fastify API (apps/api).
# Deploy from this directory (monorepo root) so the image can resolve pnpm workspaces:
#   fly deploy
#
# First-time setup:
#   fly auth login
#   fly launch --no-deploy --copy-config
#   fly secrets set DATABASE_URL=... DIRECT_URL=... WEB_ORIGIN=https://your-web-origin
#   fly deploy

app = "personal-record-api"
primary_region = "sin"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[deploy]
  strategy = "immediate"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
