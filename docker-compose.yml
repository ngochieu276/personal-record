services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: personal
      POSTGRES_PASSWORD: personal
      POSTGRES_DB: personal_record
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal -d personal_record"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
